<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kalkulator do obliczania czasu, prędkości i odległości. Dostępny offline i przyjazny dla użytkownika.">
    <meta name="theme-color" content="#f8fafc" id="meta-theme-color">
    <title>Kalkulator Czas / Prędkość / Odległość</title>
    
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet" />
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme">

    <header class="sticky-header">
        <div class="header-content">
            <h1>Kalkulator CPD</h1>
            <div class="header-tools">
                <button id="btn-font-decrease" class="icon-btn" aria-label="Zmniejsz rozmiar tekstu">
                    <span class="material-symbols-outlined">text_decrease</span>
                </button>
                <button id="btn-font-increase" class="icon-btn" aria-label="Zwiększ rozmiar tekstu">
                    <span class="material-symbols-outlined">text_increase</span>
                </button>
                <button id="btn-theme-toggle" class="icon-btn" aria-label="Przełącz motyw dzień/noc">
                    <span class="material-symbols-outlined" id="theme-icon">dark_mode</span>
                </button>
            </div>
        </div>
    </header>

    <main class="calculator-container">
        <section class="card">
            <h2>Kalkulator Czas / Prędkość / Odległość</h2>

            <div class="form-group">
                <label for="calculationType">Co chcesz obliczyć?</label>
                <select id="calculationType">
                    <option value="distance">Odległość</option>
                    <option value="speed">Prędkość</option>
                    <option value="time">Czas</option>
                </select>
            </div>

            <div class="form-group">
                <label for="distance">Odległość (km)</label>
                <input type="number" id="distance" placeholder="Wpisz odległość" aria-label="Odległość w kilometrach">
            </div>

            <div class="form-group">
                <label for="speed">Prędkość (km/h)</label>
                <input type="number" id="speed" placeholder="Wpisz prędkość" aria-label="Prędkość w kilometrach na godzinę">
            </div>

            <div class="form-group" id="time-group">
                <label>Czas</label>
                <div class="time-input-group">
                    <input type="number" id="time_h" placeholder="Godziny" min="0" aria-label="Czas - godziny">
                    <input type="number" id="time_m" placeholder="Minuty" min="0" max="59" aria-label="Czas - minuty">
                </div>
                <div class="quick-actions">
                    <button type="button" class="quick-btn" data-add-h="1" data-add-m="0" aria-label="Dodaj 1 godzinę">+1h</button>
                    <button type="button" class="quick-btn" data-add-h="0" data-add-m="15" aria-label="Dodaj 15 minut">+15m</button>
                    <button type="button" class="quick-btn" data-add-h="0" data-add-m="30" aria-label="Dodaj 30 minut">+30m</button>
                </div>
            </div>

            <div class="buttons-container">
                <button id="calculateBtn" class="primary-btn">Oblicz</button>
                <button id="resetBtn" class="secondary-btn">Wyczyść</button>
            </div>

            <div id="result" class="result-box" aria-live="polite"></div>
        </section>
    </main>
    
    <footer class="app-footer">
        <p>Współautorzy: Gemini, Piotr M 🚂, Thundo</p>
        <p>Wersja aplikacji: v1.2</p>

        <script async src="https://www.googletagmanager.com/gtag/js?id=G-W05T4L1HFD"></script>
        <script>
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());
          gtag('config', 'G-W05T4L1HFD');
        </script>
    </footer>

    <script src="script.js"></script>
</body>
</html>
